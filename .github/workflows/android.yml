name: android

# Builds an installable APK from main after every merge that can change
# the app, and on demand from the Actions tab (any branch). The ci
# workflow's android job is the PR gate; this one produces the build.
on:
  push:
    branches: [main]
    paths:
      - android/**
      - mobile/**
      # The reader WebView's assets come from the web toolchain.
      - web/**
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      # Same pinned toolchain as the ci workflow's android job.
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0"
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
      - run: ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865 make android-crdt
        working-directory: .
      - run: make android-reader
        working-directory: .
      - run: ./gradlew assembleDebug --console=plain
      - id: name
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: yana-android-${{ steps.name.outputs.short_sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
