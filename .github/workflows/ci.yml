name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - android/**
              - .github/workflows/ci.yml

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The realtime sync layer calls into the CRDT AAR, so the build
      # needs it: same pinned toolchain the android-crdt workflow uses.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The reader WebView's assets are built from the web toolchain
      # (rich.ts, KaTeX, mermaid) by make android-reader.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Validates the wrapper jar and caches Gradle's downloads.
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships the SDK; compileSdk 37 may be newer than it.
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0"
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
      - run: ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865 make android-crdt
        working-directory: .
      - run: make android-reader
        working-directory: .
      # Lint, unit tests, and the debug and release builds.
      - run: ./gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: yana-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: android/app/build/reports

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  go:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spike/crdt/js/package-lock.json
      - run: npm ci
        working-directory: spike/crdt/js
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - run: go test ./...

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: yana:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose config -q
      - run: |
          docker run -d --name yana -p 8080:8080 yana:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/readyz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/readyz
          docker rm -f yana
