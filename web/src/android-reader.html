<!doctype html>
<!-- The Android reader's page. The app loads this through
     WebViewAssetLoader, replacing __THEME__, the config script, and the
     first render's body before the page parses. Scripts load only from
     these assets, the page makes no network requests of its own, and
     every tap a note can produce leaves as a yana:// navigation the app
     answers; see web/src/android-reader.ts. -->
<html lang="en" data-theme="__THEME__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'self'">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="reader.css">
  <script type="application/json" id="yana-config"><!--YANA-CONFIG--></script>
</head>
<body>
  <div class="reader" id="yana-note">
    <template id="yana-body"><!--YANA-BODY--></template>
  </div>
  <script type="module" src="reader.js"></script>
</body>
</html>
