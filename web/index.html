<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe7">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="YANA/">
<title>YANA/</title>
<script>
// Stamp the theme before the stylesheet paints so a dark preference does
// not flash light. The app re-applies it once it boots.
(function () {
  try {
    var t = localStorage.getItem('yana.theme');
    var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    // Text size, measure and density the same way, so nothing reflows.
    var d = document.documentElement.dataset;
    var size = localStorage.getItem('yana.size'); if (size) d.size = size;
    var measure = localStorage.getItem('yana.measure'); if (measure) d.measure = measure;
    var density = localStorage.getItem('yana.density'); if (density) d.density = density;
  } catch (e) {}
})();
</script>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
